name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [comlrl-docs-updated]

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  docs-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Resolve current CoMLRL source
        uses: actions/checkout@v4
        with:
          repository: OpenMLRL/CoMLRL
          ref: main
      - name: Record source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  translate:
    needs: docs-source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: [zh-cn, ja, ko, es, fr, de]
    env:
      DOCS_LANGUAGE: ${{ matrix.language }}
      SITE_BASE_URL: https://openmlrl.github.io
      OLLAMA_MODEL: translategemma:4b
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: ${{ github.workspace }}/.cache/ollama-models
    steps:
      - name: Checkout CoMLRL docs
        uses: actions/checkout@v4
        with:
          repository: OpenMLRL/CoMLRL
          ref: ${{ needs.docs-source.outputs.sha }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.152.2'
          extended: true

      - name: Restore translated pages
        id: translations
        uses: actions/cache/restore@v4
        with:
          path: .cache/docs-translations/${{ matrix.language }}
          key: docs-translations-v1-${{ matrix.language }}-${{ env.OLLAMA_MODEL }}-${{ hashFiles('docs/scripts/translations.py', 'docs/data/languages.json') }}-${{ needs.docs-source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            docs-translations-v1-${{ matrix.language }}-${{ env.OLLAMA_MODEL }}-${{ hashFiles('docs/scripts/translations.py', 'docs/data/languages.json') }}-${{ needs.docs-source.outputs.sha }}-
            docs-translations-v1-${{ matrix.language }}-${{ env.OLLAMA_MODEL }}-${{ hashFiles('docs/scripts/translations.py', 'docs/data/languages.json') }}-
            docs-translations-v1-${{ matrix.language }}-${{ env.OLLAMA_MODEL }}-

      - name: Check whether translations are current
        id: cached-build
        run: |
          if python3 docs/scripts/build.py --languages "$DOCS_LANGUAGE" --cache-only \
              --destination "$RUNNER_TEMP/translated-docs" \
              --base-url "$SITE_BASE_URL/CoMLRL/"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore translation model
        if: steps.cached-build.outputs.ready != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-linux-amd64-${{ env.OLLAMA_MODEL }}-v1

      - name: Start local translation service
        if: steps.cached-build.outputs.ready != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ollama"
          curl --fail --location --retry 3 \
            https://ollama.com/download/ollama-linux-amd64.tar.zst \
            --output "$RUNNER_TEMP/ollama.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          rm "$RUNNER_TEMP/ollama.tar.zst"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
          nohup "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/version; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:11434/api/version

      - name: Translate changed pages and validate
        if: steps.cached-build.outputs.ready != 'true'
        run: |
          ollama pull "$OLLAMA_MODEL"
          python3 docs/scripts/build.py --languages "$DOCS_LANGUAGE" \
            --model "$OLLAMA_MODEL" \
            --destination "$RUNNER_TEMP/translated-docs" \
            --base-url "$SITE_BASE_URL/CoMLRL/"

      # Preserve completed pages even when a later translation fails.
      # Unique snapshot keys allow a retry to save a more complete cache.
      - name: Save translated pages
        if: always() && steps.translations.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/docs-translations/${{ matrix.language }}
          key: ${{ steps.translations.outputs.cache-primary-key }}

      - name: Prepare language artifact
        run: |
          mkdir -p "$RUNNER_TEMP/translation-artifact/$DOCS_LANGUAGE"
          cp -R ".cache/docs-translations/$DOCS_LANGUAGE/." \
            "$RUNNER_TEMP/translation-artifact/$DOCS_LANGUAGE/"

      - name: Upload validated translation cache
        uses: actions/upload-artifact@v4
        with:
          name: docs-translations-${{ matrix.language }}
          path: ${{ runner.temp }}/translation-artifact/
          if-no-files-found: error
          retention-days: 3

  build:
    needs: [docs-source, translate]
    runs-on: ubuntu-latest
    env:
      SITE_BASE_URL: https://openmlrl.github.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.152.2'
          extended: true

      - name: Checkout CoMLRL docs
        uses: actions/checkout@v4
        with:
          repository: OpenMLRL/CoMLRL
          ref: ${{ needs.docs-source.outputs.sha }}
          path: comlrl-src

      - name: Download validated translations
        uses: actions/download-artifact@v4
        with:
          pattern: docs-translations-*
          merge-multiple: true
          path: comlrl-src/.cache/docs-translations

      - name: Build CoMLRL docs
        working-directory: comlrl-src
        run: |
          python3 docs/scripts/build.py --multilingual --cache-only \
            --destination "$RUNNER_TEMP/comlrl-public" \
            --base-url "$SITE_BASE_URL/CoMLRL/"

      - name: Build with Hugo
        run: hugo --gc --minify -b "${SITE_BASE_URL}"

      - name: Bundle CoMLRL docs into final site
        run: |
          rm -rf public/CoMLRL
          mkdir -p public/CoMLRL
          rsync -a "$RUNNER_TEMP/comlrl-public/" public/CoMLRL/
          # CoMLRL docs include absolute /img/* references; keep root assets synced.
          if [ -d "$RUNNER_TEMP/comlrl-public/img" ]; then
            mkdir -p public/img
            rsync -a "$RUNNER_TEMP/comlrl-public/img/" public/img/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
